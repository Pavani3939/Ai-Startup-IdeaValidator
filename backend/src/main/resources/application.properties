# -------------------------------------------------
# Production datasource – PostgreSQL (Render)
# -------------------------------------------------
# Expected env vars (Render injects them automatically):
#   DATABASE_URL   – full JDBC URL (e.g. postgres://user:pass@host:5432/dbname)
#   DATABASE_USER
#   DATABASE_PASSWORD
#   DATABASE_HOST
#   DATABASE_PORT
#   DATABASE_NAME

# If DATABASE_URL is present, use it directly.
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://${DATABASE_HOST}:${DATABASE_PORT}/${DATABASE_NAME}}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${DATABASE_USER:postgres}
spring.datasource.password=${DATABASE_PASSWORD:password}

# -------------------------------------------------
# JPA / Hibernate settings
# -------------------------------------------------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# -------------------------------------------------
# Optional – keep H2 for local development (dev profile)
# -------------------------------------------------
# Activate with: -Dspring.profiles.active=dev
#   spring.datasource.url=jdbc:h2:mem:validator;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
#   spring.datasource.driver-class-name=org.h2.Driver
#   spring.datasource.username=sa
#   spring.datasource.password=
#   spring.h2.console.enabled=true
#   spring.h2.console.path=/h2-console